<!DOCTYPE html>
<head>
    <title>BareIRC</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ryanoasis/nerd-fonts@latest/css/proto-nerd-font.css">
</head>
<body>
    <a class="logo" href="/">
        <img src="./assets/logo.png" alt="BareIRC" />
    </a>
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="#" class="nav-link">Source</a></li>
            <li><a href="download.html" class="nav-link">Download</a></li>
            <li><a href="about.html" class="nav-link">About</a></li>
        </ul>
        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>

    <!-- Début du contenu avec marges latérales -->
    <div class="container">
        <div class="screenshot">
            <img src="./assets/screenshot.png" alt="Screenshot" />
        </div>
        <h2>C'est quoi</h2>
        <p>lorem ipsulum ca mere et le chien de jean richard le plus saint de tous les personnes du monde blablabla.</p>
        <h2>Pourquoi</h2>
        <p>Pourquoi pas en fait ?</p>
        <h2>Auteur</h2>
        <p>FELSNER Felipe</p>
    </div>
    <script>
        // 1. Gestion du menu Hamburger (mobile)
        const hamburger = document.querySelector('.hamburger');
        const navLinks = document.querySelector('.nav-links');

        hamburger.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });

        // 2. Gestion automatique de la page active dans la navbar
        document.addEventListener("DOMContentLoaded", function() {
            let cheminActuel = window.location.pathname.split("/").pop();

            if (cheminActuel === "" || cheminActuel === "/") {
                cheminActuel = "index.html";
            }

            const liens = document.querySelectorAll(".nav-link");
            liens.forEach(lien => {
                let hrefLien = lien.getAttribute("href");
                
                if (hrefLien === cheminActuel) {
                    lien.classList.add("active");
                }
            });
        });
    </script>
</body>
